version: '3'

dotenv:
  - .env

includes:
  mail:
    taskfile: ./mail-service/Taskfile.yml
    dir: ./mail-service
  weather:
    taskfile: ./weather-subscription-service/Taskfile.yml
    dir: ./weather-subscription-service

tasks:
  # ── Mailer .proto codegen ──────────────────────────────────────────────────
  proto-mailer:
    desc: Generate Go + gRPC code from your mail‑service .proto
    cmds:
      - task: mail:proto

  # ── Lint all services ─────────────────────────────────────────────────────
  lint:
    desc: Run linters for both services
    cmds:
      - task: mail:lint
      - task: weather:lint

  # ── Build all binaries ────────────────────────────────────────────────────
  build:
    desc: Build both mail‑service and weather‑service
    cmds:
      - task: mail:build
      - task: weather:build

  # ── Run tests ─────────────────────────────────────────────────────────────
  test:
    desc: Execute all tests (unit & integration) for both services
    cmds:
      - task: mail:test
      - task: weather:test

  # ── Bring up/down infra (Docker) ─────────────────────────────────────────
  up:
    desc: Start weather‑service infrastructure (DB, Redis, etc.)
    cmds:
      - task: weather:up

  down:
    desc: Stop weather‑service infrastructure
    cmds:
      - task: weather:down

  # ── Run individual services ───────────────────────────────────────────────
  run-mail:
    desc: Build & run only mail‑service
    cmds:
      - task: mail:run

  run-weather:
    desc: Build & run only weather‑service
    cmds:
      - task: weather:run

  proto-mailer:
    desc: Generate Go + gRPC code from your .proto files
    cmds:
      - mkdir -p pkg/protos/mailer
      - |
        protoc \
          -I protos \
          --go_out=pkg/protos/mailer \
          --go_opt=paths=source_relative \
          --go-grpc_out=pkg/protos/mailer \
          --go-grpc_opt=paths=source_relative \
          protos/mailer.proto